name = "agentmanifest-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Custom domains (zone agent-manifest.com must be on this Cloudflare account).
# Staging first; switch api.agent-manifest.com here after contract-test passes.
# Production domain api.agent-manifest.com is attached via Cloudflare dashboard/API (not wrangler.toml) to avoid CI failures when DNS still points at Railway.

[vars]
REGISTRY_ORIGIN = "https://agent-manifest.com"
